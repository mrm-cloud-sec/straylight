[defaults]
inventory = aws_ec2.yml
host_key_checking = False
stdout_callback = ansible.builtin.default
callback_result_format = yaml
interpreter_python = auto_silent
remote_tmp = /tmp/.ansible-${USER}/tmp
# Increased timeout for SSM operations and long tasks
timeout = 300
forks = 5
gathering = explicit
fact_caching = memory
strategy = host_pinned
# Prevent connection cleanup race conditions
any_errors_fatal = false
# Retry failed hosts
retry_files_enabled = True
retry_files_save_path = ./retry
# Hide warnings for cleaner output
deprecation_warnings = False

[inventory]
# Enable inventory plugins for AWS EC2 and other standard sources
enable_plugins = amazon.aws.aws_ec2, ansible.builtin.host_list, ansible.builtin.script, ansible.builtin.yaml

[ssh_connection]
ssh_args = -o ControlMaster=auto -o ControlPersist=60s -o StrictHostKeyChecking=no
pipelining = True
timeout = 30

[persistent_connection]
connect_timeout = 60
connect_retries = 3
# Better connection lifecycle management
keepalive = 30

# Connection plugin settings
# Note: Most aws_ssm options are set per-host in aws_ec2.yml inventory
[connection:aws_ssm]
# Timeout for SSM session operations (in seconds)
timeout = 300

[diff]
# Always show diffs for changed files
always = True
# Show 5 lines of context in diffs
context = 5 