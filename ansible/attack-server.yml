---
- name: Attack Server Setup
  hosts: attack_servers
  become: true
  gather_facts: true

  tasks:
    - name: Attack server acknowledgement
      ansible.builtin.debug:
        msg:
          - "Attack Server — Setup Complete"
          - ""
          - "Connectivity established and facts collected."
          - "Server is ready for additional tooling/configuration."
          - ""
          - "Host:"
          - "  - Instance:   {{ inventory_hostname }}"
          - "  - Private IP: {{ ansible_facts['default_ipv4']['address'] | default('N/A') }}"
