---
# AWS EC2 Dynamic Inventory Configuration
# This automatically discovers instances based on tags

plugin: amazon.aws.aws_ec2

# AWS Configuration - will use AWS_DEFAULT_REGION environment variable
# If not set, it will default to your AWS config

# Restrict discovery to a single region for faster, predictable inventory.
# (Without this, the plugin may consult your AWS config and can be slower/noisier.)
regions:
  - "{{ lookup('env', 'AWS_DEFAULT_REGION') | default('eu-west-1') }}"

# Cache inventory results briefly to reduce repeated EC2 API calls on back-to-back runs.
cache: true
cache_timeout: 300
cache_plugin: ansible.builtin.jsonfile
cache_connection: ./.cache/ansible-inventory
cache_prefix: aws-ec2

# Filter to only include running instances AND instances tagged for this operation
filters:
  instance-state-name: running
  # Only discover instances tagged with the current operation
  "tag:Operation": "{{ lookup('env', 'OPERATION_NAME') | default('unknown_op') }}"

# Use tags to organize into groups
keyed_groups:
  # Group by server type (from the "Type" tag) with _servers suffix
  - key: tags.Type | default('') + '_servers'
    prefix: ""
    separator: ""
  
  # Group by operation (from the "Operation" tag)
  - key: tags.Operation
    prefix: "operation"
    separator: "_"

# Filters are defined above
  
# Use instance IDs as hostnames for SSM compatibility
hostnames:
  - instance-id

# Compose variables for each host
compose:
  ansible_host: instance_id
  ansible_connection: aws_ssm
  ansible_user: admin
  ansible_aws_ssm_bucket_name: "{{ lookup('env', 'TERRAFORM_S3_BUCKET') | default('') }}"
  ansible_aws_ssm_region: "{{ lookup('env', 'AWS_DEFAULT_REGION') | default(placement.region) }}" 